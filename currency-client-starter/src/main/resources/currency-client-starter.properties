app.currency-client.enabled=${APP_CURRENCY_CLIENT_ENABLED:false}
app.currency-client.base-url=${APP_CURRENCY_CLIENT_BASE_URL:https://api.frankfurter.dev}
app.currency-client.rate-path=${APP_CURRENCY_CLIENT_RATE_PATH:/v2/rate}
app.currency-client.logger-level=${APP_CURRENCY_CLIENT_LOGGER_LEVEL:BASIC}

app.currency-client.timeout.connect-timeout=${APP_CURRENCY_CLIENT_TIMEOUT_CONNECT_TIMEOUT:3s}
app.currency-client.timeout.read-timeout=${APP_CURRENCY_CLIENT_TIMEOUT_READ_TIMEOUT:5s}

app.currency-client.retry.max-attempts=${APP_CURRENCY_CLIENT_RETRY_MAX_ATTEMPTS:3}
app.currency-client.retry.wait-duration=${APP_CURRENCY_CLIENT_RETRY_WAIT_DURATION:500ms}

app.currency-client.rate-limiter.limit-for-period=${APP_CURRENCY_CLIENT_RATE_LIMITER_LIMIT_FOR_PERIOD:10}
app.currency-client.rate-limiter.limit-refresh-period=${APP_CURRENCY_CLIENT_RATE_LIMITER_LIMIT_REFRESH_PERIOD:1s}
app.currency-client.rate-limiter.timeout-duration=${APP_CURRENCY_CLIENT_RATE_LIMITER_TIMEOUT_DURATION:0s}

app.currency-client.health.enabled=${APP_CURRENCY_CLIENT_HEALTH_ENABLED:true}