spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER:admin}
    password: ${DATABASE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  liquibase:
    enabled: true
    change-log: /db/changelog/db.changelog-master.yaml