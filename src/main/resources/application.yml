spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER:admin}
    password: ${DATABASE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  liquibase:
    enabled: true
    change-log: /db/changelog/db.changelog-master.yaml

app:
  currency-client:
    base-url: https://api.frankfurter.dev
    connect-timeout: 3000
    read-timeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,threaddump
        exclude: shutdown
  server:
    port: ${SERVER_PORT:8081}